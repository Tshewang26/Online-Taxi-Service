<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride Easy</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <div class="container d-flex flex-column align-items-center">
    <!-- Logo and Title at Top -->
    <div class="logo-section text-center">
      <img src="../image/logo.png" alt="Ride Easy Logo" class="logo-img">
      <h5 class="ride-title">Ride Easy!</h5>
    </div>

    <!-- Middle Content (Taxi + Buttons) -->
    <div class="main-section text-center flex-grow-1 d-flex flex-column justify-content-center">
      <!-- Taxi Illustration -->
      <div class="taxi-section">
        <img src="../image/taxi.png" alt="Taxi Icon" class="taxi-img">
        <h4 class="lets-go">Let's Go!!</h4>
      </div>

      <!-- Buttons -->
      <div class="btn-section">
        <!-- Login Dropdown -->
        <div class="dropdown mb-3">
          <button class="btn custom-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="fa fa-user me-2"></i> Login
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Admin Login</a></li>
            <li><a class="dropdown-item" href="#">User Login</a></li>
            <li><a class="dropdown-item" href="#">Driver Login</a></li>
          </ul>
        </div>

        <!-- Register Dropdown -->
        <div class="dropdown">
          <button class="btn custom-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
            Register
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="user_Register.html">User Register</a></li>
            <li><a class="dropdown-item" href="#">Driver Register</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="../js/login.js"></script>
</body>
</html>
