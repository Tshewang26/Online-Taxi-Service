<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registeration</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/user_Register.css">
</head>
<body>
    
     <div class="container d-flex flex-column">
    <!-- Logo and Title at Top -->
    <div class="logo-section">
      <img src="../image/logo.png" alt="Ride Easy Logo" class="logo-img">
      <h1 class="ride-title">Ride Easy!</h1>
    </div>

    <!-- Back Arrow Button Only -->
     <div class="back-arrow-section">
      <a href="login.html" class="back-arrow-btn">
       <i class="fa fa-arrow-left"></i>
      </a>
    </div>

<!-- Form Title -->
     <div class="form-section">
       <h2 class="form-title">Create your Account!</h2>

    <!-- Registration Form -->
    <div class="form-section">
      <form id="registrationForm">
        <div class="input-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required>
        </div>
        
        <div class="input-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" placeholder="Enter your phone number" required>
        </div>
        
        <div class="input-group">
          <label for="cid">CID</label>
          <input type="text" id="cid" placeholder="Enter your CID" required>
        </div>
        
        <div class="input-group">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="Create a password" required>
        </div>
        
        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
        </div>

        <div>
           <p class="small text-center">
             Already have an account? <a href="../html/mainlogin.html">Login</a>
           </p>
        </div>
        
        <button type="submit" class="btn submit-btn">
          <i class="fa fa-check me-2"></i> Done
        </button>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="../js/user_Register.js"></script>

</body>
</html>
