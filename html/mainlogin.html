<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride Easy - Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/mainlogin.css">
</head>
<body>

    <!-- Login Container -->
  <div class="login-container">

    <!-- Popup Modal -->
    <div id="registerPopup" class="popup-overlay">
      <div class="popup-box">
         <button class="popup-close">&times;</button>
        <div class="popup-content">
           <button id="userBtn" class="popup-btn">User</button>
           <button id="driverBtn" class="popup-btn">Driver</button>
        </div>
      </div>
    </div>
   <!-- Left Side: Logo + Title -->
         <div class="logo-section">
          <img src="../image/logo.png" alt="Logo" class="logo-img">
          <h2 class="ride-title">Ride Easy!</h2>
         </div>
      
         <!-- Right Side: Login Form -->
     <div class="login-box">
         <!-- Login Header -->
         <div class="login-header mb-3" style="width: 100%; height: 100%;">
          <div><i class="bi bi-person-circle login-icon" style="width: 100%; height: 100%;"></i></div>
           <h3 class="fw-bold mb-0">Login</h3>
         </div>

      <!-- Form -->
      <form>
        <div class="mb-3">
          <label for="username" class="form-label">Name</label>
          <input type="text" class="form-control input-field" id="username" placeholder="Enter your name">
        </div>

        <div class="mb-2">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control input-field" id="password" placeholder="Enter your password">
        </div>

        <div class="mb-3 text-end">
          <a href="forgot_password.html" class="forgot-link">Forgot password?</a>
        </div>

        <div class="d-grid">
          <button type="button" class="btn btn-warning enter-btn" onclick="loginUser()">Enter</button>
        </div>
        <div class="text-center mt-3">
          <span>Don’t have an account? </span>
          <a href="#" class="register-link">Register</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="../js/mainlogin.js"></script>
</body>
</html>
