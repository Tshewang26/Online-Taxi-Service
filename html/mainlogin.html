<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Login</title>
   <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/mainlogin.css">
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-3 shadow-sm rounded-3 login-card">

      <!-- Back button -->
      <div class="d-flex justify-content-start">
        <a href="#" onclick="goBack()" class="text-dark">
          <i class="bi bi-arrow-left"></i>
        </a>
      </div>

      <!-- Logo + Text -->
      <div class="text-center mb-3">
        <img src="../image/logo.png" alt="Logo" width="40" class="mb-1">
        <h6 class="fw-bold">Ride Easy!</h6>
      </div>

      <!-- Login Title -->
      <h5 class="text-center mb-4">
        <i class="bi bi-person-circle"></i> Login
      </h5>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="mb-3">
          <label for="name" class="form-label small">Name</label>
          <input type="text" class="form-control custom-input" id="name" placeholder="Enter your name" required>
        </div>

        <div class="mb-2">
          <label for="password" class="form-label small">Password</label>
          <input type="password" class="form-control custom-input" id="password" placeholder="Enter your password" required>
        </div>

        <div class="text-end mb-3">
          <a href="#" class="small">Forgot password?</a>
        </div>

        <div class="text-center">
          <button type="submit" class="btn custom-btn px-4">Enter</button>
        </div>
      </form>

      <!-- Register Link -->
      <div class="text-center mt-3">
        <p class="small">Don’t have an account? 
          <a href="../html/user_Register.html" class="fw-bold">Register</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="../js/mainlogin.js"></script>
</body>
</html>
