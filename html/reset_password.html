<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset_password.css">
</head>
<body>

  <div class="reset-container">
    <div class="reset-card row g-0">

      <!-- Left column -->
      <div class="col-md-5 left-panel d-flex flex-column justify-content-center align-items-center text-center p-4">
        <a href="forgot_password.html" class="back-btn">
          <i class="fa fa-arrow-left"></i>
        </a>
        <img src="../image/logo.png" alt="Ride Easy Logo" class="logo mb-2">
        <h5 class="tagline">Ride Easy!</h5>
        <h3 class="title">Reset your Password</h3>
      </div>

      <!-- Right column -->
      <div class="col-md-7 right-panel p-4">
        <form id="resetForm">

          <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" id="newPassword" class="form-control custom-input" placeholder="Enter new password" required>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control custom-input" placeholder="Confirm new password" required>
          </div>

          <button type="submit" class="btn btn-warning w-100 mt-3">
            <i class="fa fa-check"></i> Done
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ✅ Success Modal -->
  <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <div class="modal-header border-0">
          <h5 class="modal-title w-100" id="successModalLabel">
            <i class="fa fa-lock text-warning fa-2x"></i><br>
            Successfully Set!
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeSuccess"></button>
        </div>
        <div class="modal-body">
          <p>Your password has been updated successfully.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/reset_password.js"></script>
</body>
</html>
