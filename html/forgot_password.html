<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/forgot_password.css">
</head>
<body>

  <div class="wrapper">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="logo_ride">
        <a href="mainlogin.html" class="back-arrow-btn"><i class="fa fa-arrow-left"></i></a>
        <img src="../image/logo.png" alt="Ride Easy Logo">
        <h2>Ride Easy!</h2>
      </div>
      <h2 class="form-title" style="font-family: Arial, Helvetica, sans-serif;">Forgot Password?</h2>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <form id="forgotForm">
        <div class="input-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="Enter your phone number" required>
          <small class="text-muted">We will send OTP in SMS</small>
        </div>

        <button type="button" id="sendOtpBtn" class="btn submit-btn">
          <i class="fa fa-paper-plane me-2"></i> Send OTP
        </button>
        <small class="text-danger d-block text-center mb-4">*Valid for 15min</small>

        <div class="input-group">
          <label for="otp">Enter OTP</label>
          <input type="text" id="otp" placeholder="Enter OTP" required>
        </div>

        <button type="submit" class="btn submit-btn">
          <i class="fa fa-arrow-right me-2"></i> Next
        </button>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="../js/forgot_password.js"></script>
</body>
</html>
