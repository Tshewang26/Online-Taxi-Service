<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Profile - Online Taxi Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../CSS/driverProfile.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <div class="container-fluid app-container p-0">
        <!-- Main Content Area -->
        <div class="main-content-area">
            <!-- Profile Header -->
            <div class="profile-header">
                <button class="profile-back-btn" id="backToProfile" data-bs-toggle="tooltip" data-bs-placement="right" title="Back to Dashboard">
                    <span class="material-icons">arrow_back</span>
                </button>
                <div class="profile-header-content">
                    <!-- Logo - Add your logo image here -->
                    <img src="../Images/logo.png" alt="Ride Easy Logo" class="header-logo">
                    <span class="header-text">Ride Easy!</span>
                </div>
                <div class="profile-header-title">
                    <span class="material-icons me-2">person</span>
                    <span id="headerTitle">My Profile</span>
                </div>
            </div>

            <!-- Profile Content -->
            <div class="profile-content">
                <!-- View Mode -->
                <div id="viewMode">
                    <!-- Profile Avatar Section -->
                    <div class="profile-avatar-section">
                        <div class="profile-avatar" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Profile Picture">
                            <span class="material-icons">person</span>
                        </div>
                        <div class="profile-name" id="profileName">Sonam Tshomo</div>
                    </div>

                    <!-- Profile Details Section -->
                    <div class="profile-details-section">
                        <div class="profile-detail-item" data-bs-toggle="tooltip" data-bs-placement="left" title="Citizenship Identity Card Number">
                            <span class="detail-label">CID :</span>
                            <span class="detail-value" id="viewCid">11503005306</span>
                        </div>
                        
                        <div class="profile-detail-item" data-bs-toggle="tooltip" data-bs-placement="left" title="Contact Number">
                            <span class="detail-label">Phone no :</span>
                            <span class="detail-value" id="viewPhone">17913862</span>
                        </div>
                        
                        <div class="profile-detail-item" data-bs-toggle="tooltip" data-bs-placement="left" title="Bank Account Number">
                            <span class="detail-label">Account no :</span>
                            <span class="detail-value" id="viewAccount">216660713</span>
                        </div>
                        
                        <div class="profile-detail-item" data-bs-toggle="tooltip" data-bs-placement="left" title="Vehicle Registration Number">
                            <span class="detail-label">Car no :</span>
                            <span class="detail-value" id="viewCar">BP-1-F-2167</span>
                        </div>
                    </div>

                    <!-- Edit Profile Button -->
                    <div class="profile-actions">
                        <button class="edit-profile-btn" id="editProfileBtn" data-bs-toggle="tooltip" data-bs-placement="top" title="Edit Your Profile Information">
                            Edit Profile
                        </button>
                    </div>
                </div>

                <!-- Edit Mode -->
                <div id="editMode" style="display: none;">

                    <!-- Profile Avatar Section (Edit) -->
                    <div class="profile-avatar-section">
                        <div class="profile-avatar profile-avatar-edit">
                            <span class="material-icons">person</span>
                        </div>
                    </div>

                    <!-- Profile Details Section (Edit) -->
                    <div class="profile-details-section edit-mode-section">
                        <div class="edit-detail-item">
                            <label class="edit-label">Name :</label>
                            <div class="input-with-icon">
                                <input type="text" class="form-control" id="editName" value="Sonam Tshomo">
                                <span class="material-icons input-icon">edit</span>
                            </div>
                        </div>
                        
                        <div class="edit-detail-item">
                            <label class="edit-label">CID :</label>
                            <div class="input-with-icon">
                                <input type="text" class="form-control" id="editCid" value="11503005306" maxlength="11">
                                <span class="material-icons input-icon">edit</span>
                            </div>
                        </div>
                        
                        <div class="edit-detail-item">
                            <label class="edit-label">Phone number :</label>
                            <div class="input-with-icon">
                                <input type="tel" class="form-control" id="editPhone" value="17913862" maxlength="8">
                                <span class="material-icons input-icon">edit</span>
                            </div>
                        </div>
                        
                        <div class="edit-detail-item">
                            <label class="edit-label">Date of Birth :</label>
                            <div class="input-with-icon">
                                <input type="date" class="form-control" id="editDob" value="1995-05-15">
                                <span class="material-icons input-icon">edit</span>
                            </div>
                        </div>
                        
                        <div class="edit-detail-item">
                            <label class="edit-label">Account number :</label>
                            <div class="input-with-icon">
                                <input type="text" class="form-control" id="editAccount" value="216660713">
                                <span class="material-icons input-icon">edit</span>
                            </div>
                        </div>
                        
                        <div class="edit-detail-item">
                            <label class="edit-label">Licence Number :</label>
                            <div class="input-with-icon">
                                <input type="text" class="form-control" id="editLicence" value="DL-2018-12345">
                                <span class="material-icons input-icon">edit</span>
                            </div>
                        </div>
                        
                        <div class="edit-detail-item">
                            <label class="edit-label">Car Number :</label>
                            <div class="input-with-icon">
                                <input type="text" class="form-control" id="editCar" value="BP-1-F-2167" style="text-transform: uppercase;">
                                <span class="material-icons input-icon">edit</span>
                            </div>
                        </div>
                        
                        <div class="edit-detail-item">
                            <label class="edit-label">Type of Vehicle :</label>
                            <div class="input-with-icon">
                                <select class="form-control" id="editVehicleType">
                                    <option value="Sedan">Sedan</option>
                                    <option value="SUV">SUV</option>
                                    <option value="Hatchback">Hatchback</option>
                                    <option value="Van">Van</option>
                                </select>
                                <span class="material-icons input-icon">edit</span>
                            </div>
                        </div>
                    </div>

                    <!-- Update Button -->
                    <div class="profile-actions">
                        <button class="update-btn" id="saveProfileBtn" data-bs-toggle="tooltip" data-bs-placement="top" title="Save Changes">
                            Update
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../JSS/driverProfile.js"></script>
</body>
</html>
