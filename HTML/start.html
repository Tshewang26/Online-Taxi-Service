<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Easy Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }

        .main-interface.show {
            opacity: 1;
        }

        .initial-content {
            position: absolute;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.8s ease-in-out;
        }
        
        .initial-content.slide-up {
            transform: translateY(calc(-50vh + 45px));
            flex-direction: row;
        }

        .logo-large-container {
            width: 250px;
            height: 250px;
            margin-bottom: 25px;
            transition: all 0.5s;
        }

        /* Here's the updated size for the final logo */
        .initial-content.slide-up .logo-large-container {
            width: 45px;
            height: 45px;
            margin-bottom: 0;
            margin-right: 15px;
        }

        .ride-easy-title-large {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 2.5em;
            color: #4b4b4b;
            transition: all 0.5s;
        }

        /* Here's the updated size for the final text */
        .initial-content.slide-up .ride-easy-title-large {
            font-size: 1.4em;
        }
        
        .center-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .taxi-icon-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            opacity: 0;
            transform: scale(0.8);
            animation: scaleIn 0.8s ease-out 1.2s forwards;
        }
        
        .bottom-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 0.8s ease-out 1.5s forwards;
        }

        @keyframes slideUpFadeIn { to { transform: translateY(0); opacity: 1; } }
        @keyframes scaleIn { to { transform: scale(1); opacity: 1; } }

        .taxi-icon { width: 250px; height: auto; }
        .main-tagline { font-weight: 700; font-size: 1.8em; text-align: center; color: #222222; margin: 0 20px 40px 20px; line-height: 1.3; }
        .get-started-button { background-color: #FFD700; color: #222222; padding: 15px 40px; border: none; border-radius: 30px; font-size: 1.1em; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div class="main-interface" id="mainInterface">
        <div class="center-content">
            <div class="taxi-icon-container">
                <img src="C:\Users\ASSUS\OneDrive\Pictures\download.png" alt="Taxi Icon" class="taxi-icon">
            </div>
            <div class="bottom-content">
                <h2 class="main-tagline">Let's make your day great with Ride Easy!</h2>
                <button class="get-started-button">Let's get started!</button>
            </div>
        </div>
    </div>

    <div class="initial-content" id="initialContent">
        <div class="logo-large-container">
            <img src="C:\Users\ASSUS\OneDrive\Pictures\download (1).png" alt="Company Logo" style="width:100%; height:auto; border-radius:50%;">
        </div>
        <h1 class="ride-easy-title-large">Ride Easy!</h1>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const initialContent = document.getElementById('initialContent');
            const mainInterface = document.getElementById('mainInterface');
            
            setTimeout(() => {
                initialContent.classList.add('slide-up');
            }, 500);

            setTimeout(() => {
                mainInterface.classList.add('show');
            }, 1000);
        });
    </script>
</body>
</html>
