<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Dot Transition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        
        /* White screen */
        .white-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Yellow dot */
        .yellow-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #FFD700;
            border-radius: 50%;
            z-index: 5;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        
    </style>
</head>
<body>
    <div class="container">
        <div class="white-screen" id="whiteScreen">
            <!-- White screen content -->
        </div>
        
        <div class="yellow-dot" id="yellowDot"></div>
    
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const whiteScreen = document.getElementById('whiteScreen');
            const yellowDot = document.getElementById('yellowDot');
            const replayBtn = document.getElementById('replay');
            
            // Start the animation sequence
            function startAnimation() {
                // Step 1: Hide white screen after 1 second
                setTimeout(() => {
                    whiteScreen.style.opacity = '0';
                    whiteScreen.style.transition = 'opacity 1s';
                    
                    // Step 2: Expand yellow dot after white screen fades
                    setTimeout(() => {
                        yellowDot.style.transition = 'all 1.5s';
                        yellowDot.style.width = '4000px';
                        yellowDot.style.height = '4000px';
                        yellowDot.style.borderRadius = '0';
                        
                        // Step 3: Show replay button
                        setTimeout(() => {
                            replayBtn.style.opacity = '1';
                            replayBtn.style.transition = 'opacity 0.5s';
                        }, 1500);
                    }, 1000);
                }, 1000);
            }
            
            // Start the animation when page loads
            startAnimation();
            
            // Replay button functionality
            replayBtn.addEventListener('click', function() {
                // Reset all elements
                whiteScreen.style.opacity = '1';
                whiteScreen.style.transition = 'none';
                
                yellowDot.style.width = '20px';
                yellowDot.style.height = '20px';
                yellowDot.style.borderRadius = '50%';
                yellowDot.style.transition = 'none';
                
                replayBtn.style.opacity = '0';
                replayBtn.style.transition = 'none';
                
                // Restart animation after a brief pause
                setTimeout(startAnimation, 100);
            });
        });
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
