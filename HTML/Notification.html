<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Ride Easy!</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/notification.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button class="back-btn" onclick="window.history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="header-title">
                <h1>Notifications</h1>
                <i class="fa-solid fa-bell"></i>
            </div>
            <button class="mute-btn" id="mute-btn" title="Mute notifications">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </header>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="ride">Rides</button>
            <button class="filter-tab" data-filter="payment">Payments</button>
            <button class="filter-tab" data-filter="driver">Drivers</button>
            <button class="filter-tab" data-filter="promo">Promotions</button>
        </div>

        <div class="notification-list" id="notification-list">
            <!-- Notifications will be inserted here -->
        </div>

        <div class="empty-state" id="empty-state" style="display: none;">
            <i class="fa-solid fa-bell-slash"></i>
            <h3>No Notifications</h3>
            <p>You're all caught up! Check back later for updates.</p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../JAVA/notification.js"></script>
</body>
</html>
