<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver's Dashboard - Online Taxi Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../CSS/driverDashboard.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container-fluid app-container p-0">
        <!-- Main Content Area -->
        <div class="main-content-area">
            <!-- Header with Centered Logo -->
            <header class="dashboard-header">
                <!-- Top Row - Centered Logo -->
                <div class="row align-items-center mx-0 mb-3">
                    <div class="col-12 text-center">
                        <div class="logo-container">
                            <img src="../Images/logo.png" alt="Ride Easy Logo" class="dashboard-logo">
                            <span class="logo-text">Ride Easy!</span>
                        </div>
                    </div>
                </div>
                
                <!-- Bottom Row - Profile, Greeting, and Icons -->
                <div class="row align-items-center mx-0">
                    <!-- Left side - Profile with Greeting -->
                    <div class="col-md-6 col-8 d-flex align-items-center">
                        <div class="profile-circle me-3" id="profileIcon">
                            <img src="../Images/profile.png" alt="Profile" class="img-fluid profile-icon-placeholder">
                        </div>
                        <div>
                            <h5 class="mb-0 fw-bold">Kuzuzangpo la!</h5>
                            <p class="mb-0 text-muted">Sonam Tshomo</p>
                        </div>
                    </div>
                    
                    <!-- Right side - Notification & Settings -->
                    <div class="col-md-6 col-4 d-flex align-items-center justify-content-end">
                        <button type="button" class="icon-btn me-2" id="notificationIcon" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Notifications">
                            <span class="material-icons">notifications</span>
                        </button>
                        <button type="button" class="icon-btn" id="settingIcon" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Settings">
                            <span class="material-icons">settings</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content (Scrollable) -->
            <div class="dashboard-content">
                <!-- Seat Status Card (Full Width) -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card seat-status-card shadow-sm">
                            <div class="card-body">
                                <h6 class="card-title mb-4">Current Seat Status</h6>
                                <div class="seat-status-box p-4 rounded-3">
                                    <div class="d-flex justify-content-around mb-4">
                                        <div class="seat-icon booked">
                                            <img src="../Images/carseat.png" alt="Seat" class="seat-placeholder red">
                                        </div>
                                        <div class="seat-icon driver-seat">
                                            <img src="../Images/driverSeat.png" alt="Driver" class="driver-placeholder">
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-around">
                                        <div class="seat-icon booked">
                                            <img src="../Images/carseat.png" alt="Seat" class="seat-placeholder red">
                                        </div>
                                        <div class="seat-icon available">
                                            <img src="../Images/carseat.png" alt="Seat" class="seat-placeholder black">
                                        </div>
                                        <div class="seat-icon pending">
                                            <img src="../Images/carSeat.png" alt="Seat" class="seat-placeholder purple">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="seat-legend d-flex justify-content-around mt-4 flex-wrap">
                                    <div class="d-flex align-items-center mb-2">
                                        <span class="legend-color booked-color me-2"></span>
                                        <span>Booked</span>
                                    </div>
                                    <div class="d-flex align-items-center mb-2">
                                        <span class="legend-color available-color me-2"></span>
                                        <span>Available</span>
                                    </div>
                                    <div class="d-flex align-items-center mb-2">
                                        <span class="legend-color pending-color me-2"></span>
                                        <span>Pending</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions Card (Full Width) -->
                <div class="row">
                    <div class="col-12">
                        <div class="card actions-card shadow-sm">
                            <div class="card-body">
                                <h6 class="card-title mb-4">Quick Actions</h6>
                                <div class="action-buttons-grid">
                                    <button class="action-btn" id="resetBtn" data-bs-toggle="tooltip" data-bs-placement="top" title="Reset All Seats">
                                        <img src="../Images/reset.png" alt="Reset" class="btn-icon-placeholder">
                                        <span class="action-label">Reset Seats</span>
                                    </button>
                                    <button class="action-btn" id="viewBookingsBtn" data-bs-toggle="tooltip" data-bs-placement="top" title="View All Bookings">
                                        <img src="../Images/pre.set.png" alt="View" class="btn-icon-placeholder">
                                        <span class="action-label">View Bookings</span>
                                    </button>
                                    <button class="action-btn action-btn-large" id="searchBookingBtn" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Search Booking Details">
                                        <img src="../Images/search.png" alt="Search" class="btn-icon-placeholder">
                                        <span class="action-label">Booking Details</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../JSS/driverDashboard.js"></script>
</body>
</html>
